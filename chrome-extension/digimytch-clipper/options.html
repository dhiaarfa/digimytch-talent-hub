<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <title>Digimytch Clipper — Paramètres</title>
    <style>
      body {
        font-family: system-ui, sans-serif;
        max-width: 520px;
        margin: 32px auto;
        padding: 0 16px;
        color: #1a1a2e;
      }
      h1 { font-size: 20px; margin-bottom: 8px; color: #2e4057; }
      p { font-size: 14px; color: #64748b; line-height: 1.5; margin-bottom: 20px; }
      label { display: block; font-weight: 600; font-size: 13px; margin: 16px 0 6px; }
      input, textarea {
        width: 100%;
        padding: 8px 10px;
        border: 1px solid #cbd5e1;
        border-radius: 8px;
        font-size: 13px;
      }
      textarea { min-height: 80px; font-family: monospace; font-size: 11px; }
      button {
        margin-top: 20px;
        padding: 10px 20px;
        background: #2e4057;
        color: #fff;
        border: none;
        border-radius: 8px;
        font-weight: 600;
        cursor: pointer;
      }
      .status {
        margin-top: 16px;
        padding: 10px;
        border-radius: 8px;
        font-size: 13px;
      }
      .ok { background: #dcfce7; color: #166534; }
      .warn { background: #fef9c3; color: #854d0e; }
      #saved { color: #16a34a; font-size: 13px; margin-top: 8px; display: none; }
    </style>
  </head>
  <body>
    <h1>Digimytch Job Clipper</h1>
    <p>Configurez la connexion à votre instance Digimytch Talent Hub.</p>

    <div id="auth-status" class="status warn">Vérification…</div>

    <label for="app-url">URL de l'application</label>
    <input
      id="app-url"
      type="url"
      placeholder="http://localhost:3001"
    />

    <label for="manual-jwt">JWT manuel (optionnel)</label>
    <textarea
      id="manual-jwt"
      placeholder="Collez ici votre access_token Supabase si les cookies ne fonctionnent pas…"
    ></textarea>
    <p style="font-size: 12px; margin-top: 6px">
      Trouvez-le dans les DevTools → Application → Cookies → sb-*-auth-token, champ
      <code>access_token</code> du JSON.
    </p>

    <button id="save" type="button">Enregistrer</button>
    <p id="saved">Paramètres enregistrés.</p>

    <script src="options.js"></script>
  </body>
</html>
